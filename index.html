<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Akademik FTI UNSAP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Selamat Datang di Website Akademik FTI UNSAP</h1>
    <p>Gunakan chatbot di kanan bawah untuk menanyakan informasi akademik.</p>
  </header>

  <main>
    <section class="content">
      <h2>Informasi Umum</h2>
      <p>Website ini menyediakan layanan informasi akademik berbasis chatbot, seperti jadwal kuliah, prosedur KP, dan pendaftaran skripsi.</p>
    </section>
  </main>

  <!-- Chatbot -->
  <div class="chat-container" id="chat-container">
    <div class="chat-header">Chatbot Akademik 🤖</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Tulis pertanyaan di sini..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>
